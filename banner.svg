<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 300" width="1280" height="300" role="img" aria-label="BRYCE">
<title>Bryce Kallio</title>
<desc>Extruded neon letterforms reading BRYCE</desc>

<defs>
  <!-- Face fill. Deliberately not opaque: the extrusion behind shows through, which
       is what makes the letters read as hollow volumes rather than stickers. -->
  <linearGradient id="face" gradientUnits="userSpaceOnUse" x1="250" y1="60" x2="1030" y2="215">
    <stop offset="0.00" stop-color="#FF3DD0" stop-opacity=".44"/>
    <stop offset="0.45" stop-color="#9B4DFF" stop-opacity=".38"/>
    <stop offset="1.00" stop-color="#3DC8FF" stop-opacity=".42"/>
  </linearGradient>

  <!-- Edge light. The outline carries the colour shift, not the fill, because on a
       neon sign it is the tube that glows and the panel behind it that does not. -->
  <linearGradient id="edge" gradientUnits="userSpaceOnUse" x1="250" y1="215" x2="1030" y2="60">
    <stop offset="0.00" stop-color="#FF4FD8"/>
    <stop offset="0.40" stop-color="#C77BFF"/>
    <stop offset="0.72" stop-color="#5FE0FF"/>
    <stop offset="1.00" stop-color="#9FF4FF"/>
  </linearGradient>

  <radialGradient id="halo" gradientUnits="userSpaceOnUse" cx="640" cy="148" r="580">
    <stop offset="0"    stop-color="#8B2FD0" stop-opacity=".17"/>
    <stop offset="0.55" stop-color="#5A1AA0" stop-opacity=".07"/>
    <stop offset="1"    stop-color="#0A0520" stop-opacity="0"/>
  </radialGradient>

  <filter id="glowFar"  x="-30%" y="-60%" width="160%" height="220%">
    <feGaussianBlur stdDeviation="17"/>
  </filter>
  <filter id="glowNear" x="-20%" y="-40%" width="140%" height="180%">
    <feGaussianBlur stdDeviation="4.5"/>
  </filter>

  <!-- Letterforms. Blocky and chamfered, drawn as closed outlines so they can be
       both filled and extruded; a stroked skeleton has no interior to extrude.
       Cap height 60-215, stems 34, bars 28.
       Each letter carries its own translate rather than having its coordinates
       baked in, so tracking is one number per letter to change. The gaps are wide
       (44) because the extrusion throws ~17px to the left — tighter tracking and
       each letter's depth runs into the one before it. -->
  <g id="glyphs" fill-rule="evenodd" transform="translate(-52.5,0)">
    <!-- B: the notch in the right edge at the waist is what separates it from an 8 -->
    <path d="M310,60 H415 L425,70 V124 H401 V141 H425 V205 L415,215 H310 Z
             M344,86 H399 V118 H344 Z
             M344,157 H399 V189 H344 Z"/>
    <!-- R. The leg kicks out past the bowl rather than dropping straight, and its
         inner edge runs from the baseline up to the bowl's underside — that open
         wedge between stem and leg is the whole difference between an R and a P. -->
    <g transform="translate(18,0)">
      <path d="M451,60 H556 L566,70 V150 L580,205 L570,215 H528 L489,160 H485 V215 H451 Z
               M485,88 H530 V128 H485 Z"/>
    </g>
    <!-- Y -->
    <g transform="translate(50,0)">
      <path d="M592,60 H622 L650,112 L678,60 H707 L666,135 V215 H634 V135 Z"/>
    </g>
    <!-- C: squared aperture with short returns, so it cannot be read as a bracket -->
    <g transform="translate(68,0)">
      <path d="M743,60 H838 L848,70 V100 H814 V88 H767 V187 H814 V175 H848 V205 L838,215
               H743 L733,205 V70 Z"/>
    </g>
    <!-- E: short middle bar -->
    <g transform="translate(86,0)">
      <path d="M874,60 H979 L989,70 V88 H908 V124 H966 V152 H908 V187 H989 V205 L979,215 H874 Z"/>
    </g>
  </g>
</defs>

<!-- No panel: the letters float on the page background, whatever it is. The only
     thing painted behind them is the halo, whose outer stop is fully transparent. -->
<rect width="1280" height="300" fill="url(#halo)"/>

<!-- Sign glow spilling onto the wall behind -->
<g filter="url(#glowFar)" opacity=".72">
  <use href="#glyphs" fill="url(#edge)"/>
</g>

<!-- Extrusion, far face first -->
<g>
    <use href="#glyphs" transform="translate(-24.0,28.5)" fill="rgb(40,14,82)"/>
    <use href="#glyphs" transform="translate(-23.2,27.5)" fill="rgb(42,14,85)"/>
    <use href="#glyphs" transform="translate(-22.4,26.6)" fill="rgb(44,15,88)"/>
    <use href="#glyphs" transform="translate(-21.6,25.6)" fill="rgb(47,16,91)"/>
    <use href="#glyphs" transform="translate(-20.8,24.7)" fill="rgb(49,16,94)"/>
    <use href="#glyphs" transform="translate(-20.0,23.8)" fill="rgb(52,17,98)"/>
    <use href="#glyphs" transform="translate(-19.2,22.8)" fill="rgb(54,18,101)"/>
    <use href="#glyphs" transform="translate(-18.4,21.8)" fill="rgb(56,18,104)"/>
    <use href="#glyphs" transform="translate(-17.6,20.9)" fill="rgb(59,19,107)"/>
    <use href="#glyphs" transform="translate(-16.8,19.9)" fill="rgb(61,20,110)"/>
    <use href="#glyphs" transform="translate(-16.0,19.0)" fill="rgb(64,20,114)"/>
    <use href="#glyphs" transform="translate(-15.2,18.1)" fill="rgb(66,21,117)"/>
    <use href="#glyphs" transform="translate(-14.4,17.1)" fill="rgb(68,22,120)"/>
    <use href="#glyphs" transform="translate(-13.6,16.1)" fill="rgb(71,22,123)"/>
    <use href="#glyphs" transform="translate(-12.8,15.2)" fill="rgb(73,23,126)"/>
    <use href="#glyphs" transform="translate(-12.0,14.2)" fill="rgb(76,24,130)"/>
    <use href="#glyphs" transform="translate(-11.2,13.3)" fill="rgb(78,24,133)"/>
    <use href="#glyphs" transform="translate(-10.4,12.3)" fill="rgb(80,25,136)"/>
    <use href="#glyphs" transform="translate(-9.6,11.4)" fill="rgb(83,26,139)"/>
    <use href="#glyphs" transform="translate(-8.8,10.4)" fill="rgb(85,26,142)"/>
    <use href="#glyphs" transform="translate(-8.0,9.5)" fill="rgb(88,27,146)"/>
    <use href="#glyphs" transform="translate(-7.2,8.5)" fill="rgb(90,28,149)"/>
    <use href="#glyphs" transform="translate(-6.4,7.6)" fill="rgb(92,28,152)"/>
    <use href="#glyphs" transform="translate(-5.6,6.6)" fill="rgb(95,29,155)"/>
    <use href="#glyphs" transform="translate(-4.8,5.7)" fill="rgb(97,30,158)"/>
    <use href="#glyphs" transform="translate(-4.0,4.8)" fill="rgb(100,30,162)"/>
    <use href="#glyphs" transform="translate(-3.2,3.8)" fill="rgb(102,31,165)"/>
    <use href="#glyphs" transform="translate(-2.4,2.8)" fill="rgb(104,32,168)"/>
    <use href="#glyphs" transform="translate(-1.6,1.9)" fill="rgb(107,32,171)"/>
    <use href="#glyphs" transform="translate(-0.8,0.9)" fill="rgb(109,33,174)"/>
</g>

<!-- Back face edge, catching a little light -->
<use href="#glyphs" transform="translate(-24.0,28.5)"
     fill="none" stroke="#6FD9FF" stroke-opacity=".30" stroke-width="1.4"/>

<!-- Front face -->
<use href="#glyphs" fill="url(#face)"/>

<!-- Chromatic split. Decks call this a glitch; it is just dispersion, and without
     it the outline reads flat. -->
<g opacity=".52">
  <use href="#glyphs" transform="translate(-2.5,0)" fill="none" stroke="#00E5FF" stroke-width="2"/>
  <use href="#glyphs" transform="translate(2.5,0)"  fill="none" stroke="#FF2ECC" stroke-width="2"/>
</g>

<!-- The tube itself: a tight bloom under a hard core -->
<g filter="url(#glowNear)" opacity=".9">
  <use href="#glyphs" fill="none" stroke="url(#edge)" stroke-width="3.5"/>
</g>
<use href="#glyphs" fill="none" stroke="url(#edge)" stroke-width="2.2" stroke-linejoin="miter"/>
<use href="#glyphs" fill="none" stroke="#FFFFFF" stroke-opacity=".5" stroke-width="1"/>
</svg>
